name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  image:
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t carte-api:test .

      - name: Démarrer le conteneur
        run: docker run -d --name api -p 8000:8000 carte-api:test

      - name: Attendre l'état healthy
        run: |
          for i in $(seq 1 20); do
            etat=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "essai $i : $etat"
            [ "$etat" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs api
          exit 1

      - name: Tester l'API et l'utilisateur
        run: |
          curl -fsS http://localhost:8000/health
          test "$(docker exec api id -u)" != "0"

  publier:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            hhabchane/entrainement-devops:${{ github.sha }}
            hhabchane/entrainement-devops:latest